services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: supply-chain-lab02:latest
    container_name: supply_chain_lab02
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock # Opcional: permite escaneamento de imagens do host se montado
    stdin_open: true
    tty: true
    network_mode: bridge

